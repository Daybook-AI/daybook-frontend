<nav class="fixed inset-x-0 bottom-0 z-40 border-t border-[#2A2E37] bg-[#0F1115]/95 backdrop-blur"
    aria-label="Main navigation">
    <div
        class="mx-auto grid max-w-md grid-cols-3 px-5 pt-2.5 pb-[max(10px,env(safe-area-inset-bottom))]">
        @for (item of items; track item.route) {
        <a [routerLink]="item.route" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.route !== '/journal' }" ariaCurrentWhenActive="page"
            class="flex flex-col items-center gap-1 text-[#777B85] transition-colors hover:text-[#D9A441]">
            @switch (item.icon) {
            @case ('journal') {
            <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5" aria-hidden="true">
                <path d="M4 19V8l5-4v15M15 19V5l5 3v11M2 19h20" stroke="currentColor" stroke-width="1.7"
                    stroke-linejoin="round" />
            </svg>
            }
            @case ('chat') {
            <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5" aria-hidden="true">
                <path d="M4 5h16v11H9l-5 4V5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
                <path d="M8 9h8M8 12h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            }
            @case ('insights') {
            <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5" aria-hidden="true">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7" />
                <path d="M8 14c1-2 2.3-3 4-3s3 1 4 3M9 8.5h.01M15 8.5h.01" stroke="currentColor"
                    stroke-width="1.7" stroke-linecap="round" />
            </svg>
            }
            }
            <span class="text-[9px] font-semibold">{{ item.label }}</span>
        </a>
        }
    </div>
</nav>
