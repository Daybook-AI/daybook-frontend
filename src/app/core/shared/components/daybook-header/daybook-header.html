<header class="relative flex items-center justify-between pt-5 pb-2">
  <div class="flex items-center gap-2">
    <span class="text-lg text-[#D9A441]" aria-hidden="true">◈</span>
    <h1 class="text-lg font-semibold tracking-tight">Daybook</h1>
    <span class="rounded bg-[#24252A] px-1.5 py-0.5 text-[9px] text-[#D9A441]">AI</span>
  </div>

  <button type="button" (click)="toggleProfileMenu()"
    class="flex h-9 w-9 items-center justify-center rounded-full bg-[#D9A441] text-[#171717]"
    aria-label="Open profile menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-5 w-5">
      <circle cx="12" cy="8" r="3.5"></circle>
      <path d="M5.5 20a6.5 6.5 0 0 1 13 0"></path>
    </svg>
  </button>

  @if (isProfileMenuOpen) {
  <div class="absolute right-0 top-16 z-40 rounded-xl border border-[#2A2E37] bg-[#1A1C22] p-2 shadow-xl">
    <button type="button" (click)="logout()" [disabled]="isLoggingOut"
      class="rounded-lg px-4 py-2 text-sm hover:bg-[#272A31]">
      {{ isLoggingOut ? 'Logging out...' : 'Log out' }}
    </button>
  </div>
  }
</header>
