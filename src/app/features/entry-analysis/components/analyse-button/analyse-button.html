<button type="button" (click)="analyzeEntry()" [disabled]="isAnalyzing || !journalId" class="inline-flex h-10 items-center justify-center gap-2
         rounded-lg border border-[#3D3527]
         bg-[#211F1B] px-4
         text-sm font-medium text-[#F5B544]
         transition-all duration-200
         hover:border-[#66502D] hover:bg-[#2B261E]
         active:scale-[0.98]
         focus-visible:outline-none
         focus-visible:ring-2 focus-visible:ring-[#F5B544]/50
         focus-visible:ring-offset-2
         focus-visible:ring-offset-[#151515]
         disabled:cursor-not-allowed
         disabled:opacity-50">

    @if (isAnalyzing) {
    <svg lucideLoaderCircle class="h-4 w-4 animate-spin" aria-hidden="true">
    </svg>
    <span>Analysing...</span>
    } @else {
    <svg lucideSparkles class="h-4 w-4" aria-hidden="true">
    </svg>
    <span>Analyse</span>
    }
</button>
