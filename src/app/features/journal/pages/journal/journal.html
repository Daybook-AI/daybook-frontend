<div class="journal-home min-h-screen bg-[#0F1115] pb-24 text-[#F4F1EA]">
  <main class="mx-auto w-full max-w-md px-5">
    <app-daybook-header></app-daybook-header>

    <section class="mb-5 mt-2">
      <p class="mb-2 text-[9px] font-semibold uppercase tracking-[0.18em] text-[#D9A441]">
        ✦ Evening sanctuary · {{ todayLabel }}
      </p>
      <h2 class="journal-serif text-[27px] leading-tight tracking-tight">A moment for yourself.</h2>
      <p class="mt-2 text-xs text-[#9A9DA5]">Your thoughts, your patterns, your progress.</p>
    </section>

    <section class="quick-compose-card rounded-2xl border border-[#24272E] bg-[#191B20] p-4">
      <div class="mb-3 flex items-center justify-between">
        <span class="text-[9px] font-semibold uppercase tracking-wide text-[#D9A441]">✦ Quick reflection</span>
        <button type="button" (click)="openEditor()" class="text-[9px] text-[#9A9DA5] hover:text-[#D9A441]">Tap to
          expand ↗</button>
      </div>

      <label class="block text-[10px] font-semibold uppercase tracking-[0.12em] text-[#9A9DA5]">Title</label>
      <input type="text"
        class="quick-compose-title mt-2 w-full rounded-lg border border-[#2A2E37] bg-[#14161A] px-3 py-2 text-sm text-[#F4F1EA] placeholder:text-[#7E818A]"
        [(ngModel)]="journalTitle" (ngModelChange)="onTitleChange()" placeholder="Give this entry a title..."
        aria-label="Journal title" />

      <label class="mt-4 block text-[10px] font-semibold uppercase tracking-[0.12em] text-[#9A9DA5]">Entry</label>
      <textarea
        class="quick-compose-text mt-2 w-full resize-none rounded-xl border border-[#2A2E37] bg-[#14161A] p-3 text-sm leading-6 text-[#F4F1EA] placeholder:text-[#7E818A]"
        rows="6" [value]="quickComposerText" (input)="onQuickComposerInput($event)"
        placeholder="What's on your mind today?" aria-label="Journal entry content"></textarea>

      <div class="mt-3 flex items-center justify-between gap-3">
        <span class="text-[10px] text-[#9A9DA5]">{{ totalCharacters }} characters</span>
        <span class="text-[9px] text-[#9A9DA5]">Private &amp; encrypted</span>
      </div>

      <div class="mt-4 flex items-center justify-end">
        <button type="button" (click)="saveEntry()" [disabled]="isSaving || !journalTitle.trim()"
          class="rounded-lg bg-[#D9A441] px-4 py-2 text-[10px] font-semibold text-[#171717] transition hover:bg-[#E8B653] disabled:cursor-not-allowed disabled:opacity-60">
          {{ isSaving ? 'Submitting...' : 'Submit entry' }}
        </button>
      </div>

      @if (saveError) {
      <p class="mt-3 text-xs text-red-400" role="alert">{{ saveError }}</p>
      }
    </section>

    <button type="button" (click)="useReflectionPrompt()"
      class="mt-4 block w-full rounded-xl border border-[#252830] bg-[#191B20] p-4 text-left">
      <div class="mb-3 flex items-center justify-between">
        <span class="text-[9px] font-semibold uppercase tracking-wide text-[#D9A441]">✦ Prompt of the day</span>
        <span class="text-sm text-[#D9A441]" aria-hidden="true">⟳</span>
      </div>
      <h3 class="journal-serif text-lg italic leading-snug">“{{ reflectionPrompt }}”</h3>
      <div class="mt-3 flex items-center justify-between">
        <span class="text-[10px] font-medium text-[#D9A441]">Tap to write this prompt →</span>
        <span class="text-[9px] text-[#858994]">3 min practice</span>
      </div>
    </button>

    <div class="ritual-card mt-4 flex min-h-[78px] items-end justify-between rounded-xl p-3">
      <p class="journal-serif max-w-[210px] text-xs italic leading-relaxed text-[#F4F1EA]">“Quiet minds find their
        rhythm in stillness.”</p>
      <span class="text-[8px] uppercase leading-relaxed tracking-wide text-[#E4C17B]">Evening<br />ritual</span>
    </div>

    <!-- Recently captured -->
    <app-recent-journals (openEditorEvent)="openEditor()" [isLoading]=isLoadingEntries></app-recent-journals>
  </main>

  <app-bottom-navigation></app-bottom-navigation>
</div>
