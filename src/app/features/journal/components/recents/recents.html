<section class="mt-6">
    <div class="mb-4 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <h3 class="journal-serif text-lg">Recently captured</h3>
            <span class="rounded-full bg-[#27292E] px-2 py-1 text-[8px] text-[#9A9DA5]">{{ entries.length }}
                entries</span>
        </div>
        <button type="button" (click)="viewAllEntries()" class="text-[10px] font-semibold text-[#D9A441]">View all
            →</button>
    </div>

    @if (isLoading) {
    <p class="py-6 text-center text-xs text-[#9A9DA5]">Loading entries...</p>
    } @else if (entries.length === 0) {
    <div class="rounded-xl border border-dashed border-[#2A2E37] px-4 py-7 text-center">
        <p class="text-sm">Your story starts here.</p>
        <p class="mt-2 text-xs text-[#9A9DA5]">Capture a thought, a moment, or anything on your mind.</p>
        <button (click)="openEditor()" type="button" class="mt-4 text-xs font-semibold text-[#D9A441]">Write your first
            entry →</button>
    </div>
    } @else {
    <div class="space-y-3">
        @for (entry of entries; track entry.id) {
        <button type="button" (click)="openEntry(entry.id)"
            class="block w-full rounded-xl border border-[#252830] bg-[#191B20] p-3 text-left transition hover:border-[#51432B]">
            <div class="mb-2 flex items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                    <span class="text-[8px] font-semibold uppercase text-[#D9B36C]">{{ entry.category }}</span>
                    <span class="text-[8px] text-[#92959D]">{{ entry.dateLabel }}</span>
                </div>
                @if (entry.aiTag) {
                <span class="shrink-0 rounded bg-[#26312B] px-2 py-1 text-[8px] text-[#A5D6B0]">● {{ entry.aiTag
                    }}</span>
                }
            </div>

            <p class="line-clamp-2 text-xs leading-relaxed text-[#E4E1DB]">“{{ entry.content }}”</p>

            <div class="mt-3 flex items-center justify-between text-[9px] text-[#858994]">
                <span>▤ &nbsp; {{ entry.content.length }} characters</span>
                <span>Open entry ↗</span>
            </div>
        </button>
        }
    </div>
    }
</section>
